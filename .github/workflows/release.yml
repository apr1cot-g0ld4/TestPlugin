name: Automatic Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build
        run: bach ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TestPlugin
          path: build/libs/*-all.jar
          if-no-files-found: error